<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fandemonium Shop</title>
    <meta name="description" content="A Stripe Checkout teaching demo: buy The Strawberry Slip Dress with a test card, and watch Stripe's webhook put your name in the front row." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text x='4' y='26' font-size='26' fill='%23ff4fa6'>✦</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..700&family=Jost:wght@400..700&family=Pinyon+Script&display=swap" />
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/stage/stage.css" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="stage" class="stage" data-scene="runway"></div>

    <header class="top">
      <p class="wordmark">Fandemonium</p>
    </header>

    <main>
      <section id="card" class="glass-card product water-glass" aria-labelledby="product-name">
        <canvas id="look" class="product-art" role="img" aria-label="The Strawberry Slip Dress: sheer blush organza over a satin slip, scattered with tiny strawberries and crystals"></canvas>
        <form id="buy-form" class="product-info">
          <p class="label ripple-text">Look 01</p>
          <h1 id="product-name" class="ripple-text">The Strawberry Slip Dress</h1>
          <p class="blurb ripple-text">Sheer blush organza over a satin slip, scattered with tiny strawberries and crystals. Very 2003.</p>
          <p class="price ripple-text">$2.00</p>
          <label for="name" class="visually-hidden">Your name</label>
          <div class="buy">
            <input id="name" class="input" maxlength="30" required autocomplete="off" placeholder="Your name" />
            <button type="submit" class="pearl-button">Buy</button>
          </div>
          <p id="status" class="status" role="status"></p>
        </form>
      </section>

      <!-- The front row: everyone whose payment Stripe's signed webhook confirmed. -->
      <section id="front-row" class="front-row" aria-labelledby="front-row-title">
        <h2 id="front-row-title">front row</h2>
        <p id="arrivals" class="visually-hidden" aria-live="polite"></p>
        <ol id="board" class="names"></ol>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
    <script type="module" src="/decor.js"></script>
  </body>
</html>
